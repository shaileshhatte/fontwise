name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Lint (ESLint + web-ext)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Vendored fonts and Readability match their npm packages
        run: |
          npm run vendor
          git diff --exit-code -- extension/fonts extension/vendor extension/shared/bundled-fonts.js

      - name: Build store package
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: fontwise-extension
          path: dist/*.zip
          if-no-files-found: error

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Chromium)
        run: npm run test:e2e

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
